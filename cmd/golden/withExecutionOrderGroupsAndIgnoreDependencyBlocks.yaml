      enabled: false
      when_modified:
        - '*.hcl'
        - '*.tf*'
    dir: dependency
    execution_order_group: 0
  - autoplan:
      enabled: false
      when_modified:
        - '*.hcl'
        - '*.tf*'
    dir: depender
    execution_order_group: 1
  - autoplan:
      enabled: false
      when_modified:
        - '*.hcl'
        - '*.tf*'
    dir: depender_on_depender/nested
    execution_order_group: 1
  - autoplan:
      enabled: false
      when_modified:
        - '*.hcl'
        - '*.tf*'
    dir: depender_on_depender
    execution_order_group: 2
version: 3
